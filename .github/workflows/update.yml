name: update-profile
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["profile.config.json", "scripts/**", "render/**", "assets/**"]
permissions:
  contents: read
concurrency:
  group: update-profile
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Create bot token (GitHub App)
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.LANANGX_CLIENT_ID }}
          private-key: ${{ secrets.LANANGX_PRIVATE_KEY }}
          permission-contents: write
      - uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install render tools
        run: |
          npm install --prefix render
          cd render && npx playwright install --with-deps chromium
          sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Fetch previous assets branch (for hash skip)
        run: |
          git clone --branch assets --single-branch --depth 1 "https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/${{ github.repository }}.git" dist || mkdir dist
      - name: Fetch data, render changed scenes, write assets and README
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: node scripts/generate.mjs
      - name: Publish assets branch (orphan, only if changed)
        run: |
          cd dist
          rm -rf .git.bak
          if [ -d .git ]; then
            git add -A
            if git diff --cached --quiet; then echo "assets tidak berubah"; exit 0; fi
            rm -rf .git
          fi
          git init -q -b assets
          git config user.name "lanangx-bot"
          git config user.email "lanangx-bot@users.noreply.github.com"
          git remote add origin "https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/${{ github.repository }}.git"
          git add -A
          git commit -q -m "chore: update profile assets"
          git push -f origin assets
      - name: Commit README if changed
        run: |
          git config user.name "lanangx-bot"
          git config user.email "lanangx-bot@users.noreply.github.com"
          git add README.md
          if ! git diff --cached --quiet; then
            git commit -m "chore: update README"
            git push
          fi
