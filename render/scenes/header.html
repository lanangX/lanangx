<!DOCTYPE html><html><head><meta charset="utf-8"></head><body style="margin:0;background:#05070f">
<canvas id="c" width="900" height="400"></canvas>
<script type="module">
/* Header: scope radar miring di atas konsol, naga + siluet kota sebagai plat latar, judul "LanangX". */
import { THREE, W, H, T, TAU, PAL, MONO, K, fade, mod, rng, loadImg, getData, layer2d, createStage, scopeFace, crtFinish, text, sampleBadge, blipPoints, hex } from '/lib/common.js';
const D = getData();
const { R, ortho } = createStage();
const [dragon, skyline, logo] = await Promise.all([loadImg('/custom/dragon-sit.png'), loadImg('/custom/skyline-dragon.png'), loadImg('/custom/logo-lx-256.png')]);

/* --- lapisan latar 2D: siluet kota + naga, dimask tepi agar menyatu --- */
const bg = layer2d(ctx => {
  const sw = 300, sh = 700, s = H / sh * 1.15, dw = sw * s, dh = sh * s;
  ctx.save(); ctx.globalAlpha = .75; ctx.drawImage(skyline, W - dw + 20, H - dh + 10, dw, dh);
  ctx.globalCompositeOperation = 'destination-out';
  const g = ctx.createLinearGradient(W - dw, 0, W - dw + 110, 0); g.addColorStop(0, 'rgba(0,0,0,1)'); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g; ctx.fillRect(W - dw - 10, 0, 130, H);
  ctx.restore();
}, {});
bg.update(0);

/* --- 3D --- */
const S = new THREE.Scene(); S.fog = new THREE.Fog(PAL.bg, 5, 11);
const cam = new THREE.PerspectiveCamera(30, W / H, .1, 50);
const root = new THREE.Group(); root.position.set(1.15, 0, 0); S.add(root);

const RAD = 1.22;
/* lantai grid */
const grid = new THREE.GridHelper(14, 56, 0x12356e, 0x0b2147); grid.position.y = -.2; grid.material.transparent = true; grid.material.opacity = .65; S.add(grid);
/* bezel + alas */
const bezel = new THREE.Mesh(new THREE.CylinderGeometry(RAD + .13, RAD + .2, .14, 96), new THREE.MeshBasicMaterial({ color: 0x0a1630 })); bezel.position.y = -.08; root.add(bezel);
const rim = new THREE.Mesh(new THREE.TorusGeometry(RAD + .12, .012, 8, 128), new THREE.MeshBasicMaterial({ color: 0x2f8cff })); rim.rotation.x = Math.PI / 2; rim.position.y = 0; root.add(rim);
const slab = new THREE.Mesh(new THREE.BoxGeometry(3.5, .1, 2.7), new THREE.MeshBasicMaterial({ color: 0x070f22 })); slab.position.y = -.19; root.add(slab);
const slabEdge = new THREE.LineSegments(new THREE.EdgesGeometry(slab.geometry), new THREE.LineBasicMaterial({ color: 0x1b4fa8 })); slabEdge.position.copy(slab.position); root.add(slabEdge);
/* wajah scope */
const face = new THREE.Mesh(new THREE.CircleGeometry(RAD, 96), new THREE.MeshBasicMaterial({ map: scopeFace({ ringCount: 4 }) })); face.rotation.x = -Math.PI / 2; root.add(face);
/* sapuan fosfor */
const sweepMat = new THREE.ShaderMaterial({
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  uniforms: { uSweep: { value: 0 }, uK: { value: K } },
  vertexShader: 'varying vec2 vP; void main(){ vP=position.xy; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);} ',
  fragmentShader: `varying vec2 vP; uniform float uSweep; uniform float uK; const float TAU=6.28318530718;
    void main(){ float th=atan(vP.x, vP.y); float d=mod(uSweep-th, TAU); float a=exp(-uK*d/TAU);
      float line=smoothstep(.05,0.0,d)*1.0; float r=length(vP)/${RAD.toFixed(2)};
      vec3 c=vec3(.10,.45,1.0)*a*.55+vec3(.5,.85,1.0)*line; gl_FragColor=vec4(c*smoothstep(1.0,.97,r),1.0);} `,
});
const sweep = new THREE.Mesh(new THREE.CircleGeometry(RAD, 96), sweepMat); sweep.rotation.x = -Math.PI / 2; sweep.position.y = .004; root.add(sweep);

/* blip dari data kontribusi (dekoratif di header: bearing=hari, cincin=tingkat) */
const days = D.days || []; const N = days.length || 365; const rnd = rng(11);
const tiers = c => c >= 8 ? .46 : c >= 4 ? .60 : c >= 2 ? .74 : .88;
const items = []; days.forEach((c, i) => { if (c > 0) items.push({ th: (i + .5) / N * TAU, r: (tiers(c) + (rnd() - .5) * .05) * RAD * .92, c }); });
const blips = blipPoints(Math.max(1, items.length)); root.add(blips); blips.position.y = .03;
const pos = blips.geometry.attributes.position, sz = blips.geometry.attributes.aSize, al = blips.geometry.attributes.aAlpha, co = blips.geometry.attributes.aColor;
const cIce = hex(PAL.ice), cCy = hex(PAL.cyan);
items.forEach((b, k) => { pos.setXYZ(k, b.r * Math.sin(b.th), 0, -b.r * Math.cos(b.th)); sz.setX(k, .042 + .016 * Math.sqrt(b.c)); const c = cCy.clone().lerp(cIce, Math.min(1, b.c / 12)); co.setXYZ(k, c.r, c.g, c.b); });
pos.needsUpdate = sz.needsUpdate = co.needsUpdate = true;

/* logo LX di pusat scope */
const lx = new THREE.Mesh(new THREE.PlaneGeometry(.72, .72), new THREE.MeshBasicMaterial({ map: (() => { const t = new THREE.Texture(logo); t.needsUpdate = true; t.colorSpace = THREE.SRGBColorSpace; return t; })(), transparent: true, depthWrite: false, opacity: .95 }));
lx.rotation.x = -Math.PI / 2; lx.position.y = .045; root.add(lx);
const back = new THREE.Mesh(new THREE.CircleGeometry(.4, 48), new THREE.MeshBasicMaterial({ color: 0x040b1c, transparent: true, opacity: .88, depthWrite: false })); back.rotation.x = -Math.PI / 2; back.position.y = .035; root.add(back);

/* naga duduk (billboard bermask) */
const dc = document.createElement('canvas'); dc.width = 360; dc.height = 343; { const x = dc.getContext('2d'); x.drawImage(dragon, 0, 0);
  x.globalCompositeOperation = 'destination-in'; const g = x.createRadialGradient(190, 175, 40, 190, 175, 190); g.addColorStop(0, 'rgba(0,0,0,1)'); g.addColorStop(.62, 'rgba(0,0,0,1)'); g.addColorStop(1, 'rgba(0,0,0,0)'); x.fillStyle = g; x.fillRect(0, 0, 360, 343); }
const dt = new THREE.CanvasTexture(dc); dt.colorSpace = THREE.SRGBColorSpace;
const dr = new THREE.Mesh(new THREE.PlaneGeometry(1.0, .953), new THREE.MeshBasicMaterial({ map: dt, transparent: true, depthWrite: false })); dr.position.set(-1.45, .42, 1.12); root.add(dr);

/* --- HUD 2D: judul, tagline, label --- */
const hud = layer2d((ctx, t) => {
  ctx.save();
  ctx.font = `bold 64px ${MONO}`; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  ctx.shadowColor = '#2f8cff'; ctx.shadowBlur = 22; ctx.fillStyle = PAL.ice; ctx.fillText('Lanang', 40, 150);
  const wl = ctx.measureText('Lanang').width; ctx.fillStyle = PAL.phos; ctx.fillText('X', 40 + wl, 150);
  ctx.restore();
  ctx.strokeStyle = PAL.phos; ctx.globalAlpha = .8; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(40, 168); ctx.lineTo(360, 168); ctx.stroke(); ctx.globalAlpha = 1;
  text(ctx, 'EXPLORE  •  EXPLOIT  •  SECURE', 40, 196, { size: 15, color: PAL.cyan });
  text(ctx, 'CYBERSECURITY LEARNER  /  PENTEST  /  LINUX', 40, 232, { size: 12, color: PAL.dim });
  text(ctx, 'OPEN SOURCE  /  AUTOMATION  /  INDONESIA', 40, 252, { size: 12, color: PAL.dim });
  const blink = Math.floor(t * 2) % 2 === 0;
  text(ctx, 'lanang@kali:~$ ' + (blink ? '_' : ' '), 40, 300, { size: 16, color: PAL.cyan, glow: 8 });
  text(ctx, 'SCOPE  ' + String(D.login || '').toUpperCase() + '  /  PPI 360°  /  SWEEP 8s', 40, 372, { size: 11, color: PAL.dim });
  sampleBadge(ctx, D);
  crtFinish(ctx, t);
});

const sweepPhase = 1.1;
window.renderFrame = t => {
  const p = t / T * TAU;
  sweepMat.uniforms.uSweep.value = mod(p + sweepPhase, TAU);
  const swp = mod(p + sweepPhase, TAU);
  for (let k = 0; k < items.length; k++) { const d = mod(swp - items[k].th, TAU); al.setX(k, .2 + .8 * fade(d) + (d < .12 ? .6 : 0)); }
  al.needsUpdate = true;
  lx.material.opacity = .82 + .13 * Math.sin(p * 2);
  const az = .22 * Math.sin(p), el = 52 + 3 * Math.sin(p + 1);
  const dist = 6.0, e = THREE.MathUtils.degToRad(el);
  cam.position.set(-.18 + dist * Math.sin(az) * Math.cos(e) * .6, dist * Math.sin(e) * .62, dist * Math.cos(az) * Math.cos(e) + 1.2);
  cam.lookAt(-.18, -.05, .15);
  hud.update(t);
  R.clear(); R.render(bg.scene, ortho); R.clearDepth(); R.render(S, cam); R.clearDepth(); R.render(hud.scene, ortho);
};
window.renderFrame(0); window.ready = true;
</script></body></html>
