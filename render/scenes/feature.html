<!DOCTYPE html><html><head><meta charset="utf-8"></head><body style="margin:0;background:#05070f">
<canvas id="c" width="900" height="400"></canvas>
<script type="module">
/* Feature project: target terlacak. Hub = profil, target = repo, titik histori = tanggal commit nyata
   (jarak antar titik = log waktu sejak commit). Posisi target di scope bersifat dekoratif (diturunkan dari nama repo). */
import { THREE, W, H, T, TAU, PAL, MONO, K, fade, mod, getData, layer2d, createStage, scopeFace, crtFinish, text, wrap, sampleBadge, blipPoints, hex, toScreen, loadImg } from '/lib/common.js';
const D = getData();
const { R, ortho } = createStage();
const repo = D.repo || { name: '-', description: '', language: '', stars: 0, pushedAt: '', commits: [], url: '' };
const logo = await loadImg('/custom/logo-lx-256.png');
const now = Date.parse(D.updated || repo.pushedAt || '2026-01-01T00:00:00Z');
const dayMs = 86400000;
const ago = iso => iso ? Math.max(0, Math.round((now - Date.parse(iso)) / dayMs)) : null;
const agoTxt = d => d === null ? '-' : d === 0 ? 'TODAY' : d < 60 ? `${d}D AGO` : d < 700 ? `${Math.round(d / 30)}MO AGO` : `${Math.round(d / 365)}Y AGO`;

const S = new THREE.Scene(); S.fog = new THREE.Fog(PAL.bg, 6, 12);
const cam = new THREE.PerspectiveCamera(30, W / H, .1, 50);
const RAD = 1.2; const root = new THREE.Group(); S.add(root);
const grid = new THREE.GridHelper(14, 56, 0x12356e, 0x0b2147); grid.position.y = -.2; grid.material.transparent = true; grid.material.opacity = .5; S.add(grid);
const base = new THREE.Mesh(new THREE.CylinderGeometry(RAD + .1, RAD + .16, .12, 96), new THREE.MeshBasicMaterial({ color: 0x0a1630 })); base.position.y = -.07; root.add(base);
const rim = new THREE.Mesh(new THREE.TorusGeometry(RAD + .09, .012, 8, 128), new THREE.MeshBasicMaterial({ color: 0x2f8cff })); rim.rotation.x = Math.PI / 2; root.add(rim);
const face = new THREE.Mesh(new THREE.CircleGeometry(RAD, 96), new THREE.MeshBasicMaterial({ map: scopeFace({ ringCount: 3 }) })); face.rotation.x = -Math.PI / 2; root.add(face);
const sweepMat = new THREE.ShaderMaterial({ transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, uniforms: { uSweep: { value: 0 }, uK: { value: K } },
  vertexShader: 'varying vec2 vP; void main(){ vP=position.xy; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);} ',
  fragmentShader: `varying vec2 vP; uniform float uSweep; uniform float uK; const float TAU=6.28318530718;
    void main(){ float th=atan(vP.x, vP.y); float d=mod(uSweep-th, TAU); float a=exp(-uK*d/TAU); float line=smoothstep(.05,0.0,d); float r=length(vP)/${RAD.toFixed(2)};
      gl_FragColor=vec4((vec3(.10,.45,1.0)*a*.45+vec3(.5,.85,1.0)*line)*smoothstep(1.0,.97,r),1.0);} ` });
const sweep = new THREE.Mesh(new THREE.CircleGeometry(RAD, 96), sweepMat); sweep.rotation.x = -Math.PI / 2; sweep.position.y = .004; root.add(sweep);

/* hub: logo LX */
const lt = new THREE.Texture(logo); lt.needsUpdate = true; lt.colorSpace = THREE.SRGBColorSpace;
const lx = new THREE.Mesh(new THREE.PlaneGeometry(.34, .34), new THREE.MeshBasicMaterial({ map: lt, transparent: true, depthWrite: false })); lx.rotation.x = -Math.PI / 2; lx.position.y = .03; root.add(lx);

/* posisi target dekoratif dari hash nama */
let h = 2166136261; for (const ch of repo.name) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619) >>> 0; }
const thT = ((h % 1000) / 1000) * (TAU * .6) + .5, rT = .62 * RAD;
const P = (th, r) => new THREE.Vector3(r * Math.sin(th), 0, -r * Math.cos(th));
/* titik histori di sepanjang cincin, mundur dari target (berlawanan arah sapuan) */
const cm = (repo.commits || []).slice(0, 8); const newest = cm.length ? Date.parse(cm[0]) : now;
const trail = cm.slice(1).map(d => { const dd = Math.max(0, (newest - Date.parse(d)) / dayMs); const s = .035 * Math.log1p(dd) * 3.2 + .05; return { th: thT - s / rT, days: dd, date: d }; });
const pts = blipPoints(1 + trail.length); pts.position.y = .035; root.add(pts);
const pp = pts.geometry.attributes.position, ps = pts.geometry.attributes.aSize, pa = pts.geometry.attributes.aAlpha, pc = pts.geometry.attributes.aColor;
const all = [{ th: thT, r: rT, size: .16, col: hex(PAL.amber) }].concat(trail.map(t => ({ th: t.th, r: rT, size: .06, col: hex(PAL.cyan) })));
all.forEach((o, k) => { const v = P(o.th, o.r); pp.setXYZ(k, v.x, 0, v.z); ps.setX(k, o.size); pc.setXYZ(k, o.col.r, o.col.g, o.col.b); });
pp.needsUpdate = ps.needsUpdate = pc.needsUpdate = true;
/* garis bearing hub -> target */
const bl = new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0, .03, 0), P(thT, rT).setY(.03)]), new THREE.LineBasicMaterial({ color: 0x2f8cff, transparent: true, opacity: .5 })); root.add(bl);
/* braket penanda target (kotak di sekitar target) */
const bx = new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints([[-1, -1], [1, -1], [1, 1], [-1, 1]].map(([a, b]) => new THREE.Vector3(a * .085, 0, b * .085))), new THREE.LineBasicMaterial({ color: 0xffb020 }));
bx.position.copy(P(thT, rT)).setY(.04); root.add(bx);

const days = ago(repo.pushedAt);
const hud = layer2d((ctx, t) => {
  const tp = toScreen(P(thT, rT).setY(.035).applyMatrix4(root.matrixWorld), cam);
  const X0 = 500, Y0 = 58, BW = 372, BH = 258;
  /* leader line */
  ctx.strokeStyle = PAL.amber; ctx.lineWidth = 1.5; ctx.globalAlpha = .9; ctx.beginPath(); ctx.moveTo(tp.x + 14, tp.y - 4); ctx.lineTo(tp.x + 40, Y0 + 40); ctx.lineTo(X0, Y0 + 40); ctx.stroke(); ctx.globalAlpha = 1;
  /* data block */
  ctx.fillStyle = 'rgba(4,12,30,.78)'; ctx.fillRect(X0, Y0, BW, BH); ctx.strokeStyle = PAL.phos; ctx.lineWidth = 1.5; ctx.strokeRect(X0, Y0, BW, BH);
  ctx.fillStyle = PAL.amber; ctx.fillRect(X0, Y0, 4, BH);
  text(ctx, 'TRK 01  /  FEATURED PROJECT', X0 + 18, Y0 + 24, { size: 11, color: PAL.cyan, bold: true });
  text(ctx, String(repo.name).toUpperCase(), X0 + 18, Y0 + 58, { size: 26, color: PAL.ice, bold: true, glow: 10 });
  const meta = [repo.language ? repo.language.toUpperCase() : null, `★ ${repo.stars ?? 0}`, days === null ? null : `PUSHED ${agoTxt(days)}`].filter(Boolean).join('  ·  ');
  text(ctx, meta, X0 + 18, Y0 + 82, { size: 12, color: PAL.cyan });
  const lines = wrap(ctx, repo.description || 'No description.', BW - 40, `13px ${MONO}`).slice(0, 4);
  lines.forEach((l, i) => text(ctx, l + (i === 3 && wrap(ctx, repo.description || '', BW - 40, `13px ${MONO}`).length > 4 ? '…' : ''), X0 + 18, Y0 + 114 + i * 19, { size: 13, color: PAL.ice }));
  text(ctx, `HISTORY  ${trail.length + (cm.length ? 1 : 0)} COMMITS  ·  SPACING = LOG(TIME SINCE COMMIT)`, X0 + 18, Y0 + BH - 44, { size: 9.5, color: PAL.dim });
  text(ctx, String(repo.url || '').replace(/^https?:\/\//, ''), X0 + 18, Y0 + BH - 20, { size: 12, color: PAL.cyan });
  text(ctx, 'TRACK POSITION IS DECORATIVE', 40, 372, { size: 10, color: PAL.dim });
  sampleBadge(ctx, D); crtFinish(ctx, t);
});

cam.setViewOffset(W, H, 205, 0, W, H);
const phase = .5;
window.renderFrame = t => {
  const p = t / T * TAU, swp = mod(p + phase, TAU); sweepMat.uniforms.uSweep.value = swp;
  all.forEach((o, k) => { const d = mod(swp - mod(o.th, TAU), TAU); pa.setX(k, (k === 0 ? .8 : .4) + (k === 0 ? .2 : .6) * fade(d) + (d < .12 ? .5 : 0)); }); pa.needsUpdate = true;
  bx.scale.setScalar(1 + .12 * Math.sin(p * 2));
  const az = .22 * Math.sin(p), e = THREE.MathUtils.degToRad(55 + 2.5 * Math.sin(p + 1)), dist = 6.6;
  cam.position.set(dist * Math.sin(az) * Math.cos(e) * .7, dist * Math.sin(e) * .62, dist * Math.cos(az) * Math.cos(e) + .5);
  cam.lookAt(0, -.05, .1); cam.updateMatrixWorld(); root.updateMatrixWorld(true);
  hud.update(t);
  R.clear(); R.render(S, cam); R.clearDepth(); R.render(hud.scene, ortho);
};
window.renderFrame(0); window.ready = true;
</script></body></html>
